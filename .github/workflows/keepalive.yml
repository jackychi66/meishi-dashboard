name: Supabase Keep-Alive

# 每 3 天叫用一次 Supabase REST API，產生資料庫活動，
# 避免免費方案「閒置 7 天自動暫停」導致後台登入出現 Failed to fetch。
on:
  schedule:
    - cron: "0 2 */3 * *"   # UTC 02:00（台灣時間 10:00），每 3 天一次
  workflow_dispatch:         # 也可在 Actions 頁面手動執行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          URL="https://rnfoiterxmmryvwbfyua.supabase.co/rest/v1/profiles?select=id&limit=1"
          KEY="sb_publishable_54p-0XXq0my6_Se8mAEPUA_vm0UPU8A"
          CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 30 \
                 -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL")
          echo "HTTP $CODE"
          head -c 300 /tmp/resp.txt || true
          echo
          if [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "✅ Supabase 有回應，專案存活"
          else
            echo "⚠️ Supabase 無回應（HTTP $CODE），專案可能已暫停"
            echo "請到 https://supabase.com/dashboard/project/rnfoiterxmmryvwbfyua 點 Resume project"
            exit 1
          fi
